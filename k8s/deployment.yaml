apiVersion: apps/v1
kind: Deployment
metadata:
  name: heatwave-api
  labels: {app: heatwave-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: heatwave-api}
  template:
    metadata:
      labels: {app: heatwave-api}
    spec:
      containers:
      - name: heatwave-api
        image: DOCKERHUB_USER/heatwave-api:v1      # <-- replace DOCKERHUB_USER
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits:   {cpu: 500m, memory: 512Mi}
